[package]
name = "get-git"
version = "0.3.0"
authors = ["Igna <saltyfish2233@gmail.com>"]
description = "Download one file or directory from a GitHub repository without checking out the rest"
categories = ["command-line-utilities", "accessibility"]
repository = "https://github.com/Sssssaltyfish/get-git"
license = "MIT"
edition = "2021"
keywords = ["git", "github", "partial-clone", "download"]

[features]
default = ["backend-git2", "backend-system", "vendored-openssl"]
backend-git2 = ["dep:git2"]
backend-system = []
vendored-openssl = ["git2?/vendored-openssl"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
http = "1.3"
percent-encoding = "2.3"
tempfile = "3.23"
git2 = { version = "0.21", optional = true, default-features = false, features = ["https", "ssh", "vendored-libgit2"] }
